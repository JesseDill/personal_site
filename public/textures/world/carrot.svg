<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Transparent background; vertical carrot body + leaves -->
  <!-- Green leaves -->
  <rect x="6" y="0" width="4" height="2" fill="#3a9a3a" />
  <rect x="5" y="2" width="2" height="1" fill="#2d7a2d" />
  <rect x="9" y="2" width="2" height="1" fill="#2d7a2d" />
  <rect x="7" y="1" width="2" height="1" fill="#4ab84a" />
  <!-- Orange body (tapered) -->
  <rect x="6" y="3" width="4" height="2" fill="#f09838" />
  <rect x="5" y="5" width="6" height="2" fill="#e88630" />
  <rect x="5" y="7" width="6" height="2" fill="#e07020" />
  <rect x="6" y="9" width="4" height="2" fill="#d47428" />
  <rect x="7" y="11" width="2" height="2" fill="#c46820" />
  <rect x="7" y="13" width="2" height="2" fill="#b55a18" />
  <!-- Detail -->
  <rect x="4" y="6" width="1" height="1" fill="#c46820" />
  <rect x="11" y="8" width="1" height="1" fill="#c46820" />
</svg>
